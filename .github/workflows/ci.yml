name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      # The extension host's Node is determined by the VS Code version. Cover both ends:
      # the lower bound of engines.vscode (1.101 = Node 22) and the latest (1.136 = Node 24).
      # fail-fast is off so a failure on one still shows the other's result.
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      # Actions are pinned by commit SHA: a tag can be repointed at other code, and CI runs
      # with this repository's GITHUB_TOKEN. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GITHUB_TOKEN behind for later steps to find. Nothing here
          # pushes, and `npm ci` below runs third-party package code.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --ignore-scripts: no dependency gets to run code at install time. Only
      # @vscode/vsce-sign carries an install script, and packaging does not need it.
      - run: npm ci --ignore-scripts
      # Fail on a known-vulnerable dependency rather than waiting for someone to run this by hand
      - run: npm audit --audit-level=high
      # Mechanically guarantee zero dependencies (an empty `dependencies`)
      - run: npm run check:zero-deps
      - run: npm run build
      - run: npm test
      # Confirm the .vsix can be built, and that it carries nothing but the distribution
      - run: npx vsce package --out chirin.vsix
      - name: Confirm the .vsix carries only the distribution
        run: |
          # An allowlist, not a list of things to reject: vsce packages untracked files too, so
          # a denylist only ever stops what someone thought to name. Anything this repository
          # does not account for has to fail instead of shipping unnoticed.
          # Assigning from the substitution tells an unzip failure apart from an empty listing
          # (the step runs under `bash -e`, so a failing unzip ends it right here).
          listing=$(unzip -Z1 chirin.vsix)
          # The distribution is dist/src, hooks, media, the nls bundles, README and LICENSE.
          # dist/src is limited to .js so a stray .map or dist/test/ cannot pass, and the
          # walkthrough keeps its one localized sibling directory (see README, Localization).
          allowed='^(\[Content_Types\]\.xml|extension\.vsixmanifest|extension/(LICENSE\.txt|readme\.md|package\.json|package\.nls(\.ja)?\.json|dist/src/.+\.js|hooks/[^/]+|media/icon\.png|media/walkthrough/(ja/)?[^/]+\.md))$'
          unexpected=$(grep -vE "$allowed" <<< "$listing") && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::the .vsix carries files this repository does not account for"
            echo "$unexpected"
            exit 1
          elif [ "$status" -ne 1 ]; then
            # 1 is "nothing outside the allowlist"; anything else means grep itself failed and
            # the check never ran, which must not read as success
            echo "::error::grep failed while checking the .vsix listing"
            exit 1
          fi
          # An allowlist can only reject what is there, never notice what is absent, so pin
          # down that the .vsix actually carries the extension
          for required in extension/package.json extension/dist/src/extension.js; do
            if ! grep -qxF "$required" <<< "$listing"; then
              echo "::error::$required is missing from the .vsix"
              exit 1
            fi
          done
