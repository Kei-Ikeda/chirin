name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      # The extension host's Node is determined by the VS Code version. Cover both ends:
      # the lower bound of engines.vscode (1.101 = Node 22) and the latest (1.136 = Node 24).
      # fail-fast is off so a failure on one still shows the other's result.
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      # Actions are pinned by commit SHA: a tag can be repointed at other code, and CI runs
      # with this repository's GITHUB_TOKEN. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GITHUB_TOKEN behind for later steps to find. Nothing here
          # pushes, and `npm ci` below runs third-party package code.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --ignore-scripts: no dependency gets to run code at install time. Only
      # @vscode/vsce-sign carries an install script, and packaging does not need it.
      - run: npm ci --ignore-scripts
      # Fail on a known-vulnerable dependency rather than waiting for someone to run this by hand
      - run: npm audit --audit-level=high
      # Mechanically guarantee zero dependencies (an empty `dependencies`)
      - run: npm run check:zero-deps
      - run: npm run build
      - run: npm test
      # Confirm the .vsix can be built (and that it carries no src/ or test/)
      - run: npx vsce package --out chirin.vsix
      - name: Confirm the .vsix carries no sources
        run: |
          # Tell an unzip failure apart from grep finding nothing. Piping them directly would
          # let the check pass even when unzip fails (pipefail does not apply inside an if).
          listing=$(unzip -l chirin.vsix)
          if grep -E "extension/(src|test|dist/test|tmp|\.tmp)/" <<< "$listing"; then
            echo "::error::the .vsix contains sources, tests or scratch files"
            exit 1
          fi
