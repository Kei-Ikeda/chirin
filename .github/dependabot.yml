# Version updates, on top of the security updates that are enabled in the repository settings.
#
# Security updates alone were not enough: the js-yaml advisory reached this tree through four
# levels of transitive devDependencies, where the fix was a major bump of the direct dependency
# (@vscode/vsce), so no automatic pull request arrived and the advisory sat on main until
# someone ran `npm audit` by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # A release is only offered once it is 7 days old (Dependabot's own default is 3). A
    # hijacked publish is usually caught and pulled within days, and this waits that out.
    # Security updates are not subject to cooldown, so an advisory fix still arrives at once.
    cooldown:
      default-days: 7
    ignore:
      # These two are pinned on purpose, not left behind, and the first Dependabot run
      # offered to raise both. @types/vscode has to equal the lower bound of
      # engines.vscode, which is what makes an API missing from the minimum VS Code a type
      # error; it moves only when that lower bound deliberately moves. @types/node tracks
      # the extension host's Node at that same lower bound, so 22.x is welcome and a major
      # is not.
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # This is what keeps the SHA pins in the workflows from going stale. Pinning an action by
  # commit SHA stops it from being repointed at other code, at the cost of freezing it;
  # Dependabot rewrites both the SHA and its version comment, so the pins stay current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Same 7 days as npm: a new action release runs in CI with this repository's token
    cooldown:
      default-days: 7
